name: make-keystore

# 一次性：生成固定签名用的 keystore 并提交回仓库
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 生成 keystore（已存在就跳过）
        run: |
          mkdir -p keystore
          if [ -f keystore/dshpet.jks ]; then echo "already exists"; exit 0; fi
          keytool -genkeypair -keystore keystore/dshpet.jks -alias dshpet \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dshpet123 -keypass dshpet123 \
            -dname "CN=dshpet, OU=pet, O=pet, L=SZ, S=GD, C=CN"
          ls -l keystore
      - name: 提交回仓库
        run: |
          git config user.email pet@local
          git config user.name pet
          git add keystore
          git diff --cached --quiet || git commit -m "chore: 固定签名 keystore（保证后续版本可覆盖安装）"
          git push

name: build-patched-apk

# 云端给「大肥鱼桌宠」打文件桥补丁并出 debug APK
# 用法：Actions → build-patched-apk → Run workflow
# 修正：不再用 android-actions/setup-android（在 ubuntu-latest 上会失败），改用 runner 预装的 Android SDK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出上游源码（固定提交，保证补丁可打）
        uses: actions/checkout@v4
        with:
          repository: Tony-Chen-Stark/dsh-pet-android
          ref: eca369a4318766e057d2b62d9db5bc1447ab62e8

      - name: 下载并应用文件桥补丁
        run: |
          curl -fsSL https://paste.rs/Uy0OZ -o /tmp/link.patch
          wc -l /tmp/link.patch
          git apply --verbose /tmp/link.patch
          grep -n PetBridge app/src/main/java/com/dshpet/android/PetService.kt
          grep -n MANAGE_EXTERNAL_STORAGE app/src/main/AndroidManifest.xml

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 准备 Android SDK（用 runner 预装，逐级兜底）
        run: |
          set -x
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          echo "$ANDROID_SDK_ROOT"
          if command -v sdkmanager >/dev/null 2>&1; then SM=sdkmanager;
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager";
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager";
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/tools/bin/sdkmanager";
          else echo "no sdkmanager found"; exit 1; fi
          echo "SM=$SM"
          yes | "$SM" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          echo "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: 还原素材
        run: |
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh

      - name: 构建 APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk

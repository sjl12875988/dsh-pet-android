name: build-patched-apk

# 从本仓库（已含文件桥补丁 + 屏幕抓帧能力）直接构建 debug APK
# 用法：Actions → build-patched-apk → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 准备 Android SDK（用 runner 预装，逐级兜底）
        run: |
          set -x
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          if command -v sdkmanager >/dev/null 2>&1; then SM=sdkmanager;
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager";
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager";
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then SM="$ANDROID_SDK_ROOT/tools/bin/sdkmanager";
          else echo "no sdkmanager found"; exit 1; fi
          echo "SM=$SM"
          yes | "$SM" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: 还原素材
        run: |
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh

      - name: 构建 APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
